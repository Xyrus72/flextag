name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — syntax + unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Syntax check every file
        run: |
          set -e
          for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f"; done
      - name: Unit tests (no network, no database)
        run: npm test
        env: { IG_JOBS: 'off', NODE_ENV: test }

  frontend:
    name: Frontend — lint + build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Lint (advisory until the pre-existing debt is cleared)
        run: npx eslint . || echo "::warning::ESLint reported problems — see log"
      - name: Production build
        run: npm run build
